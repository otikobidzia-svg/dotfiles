# yambar config for Hyprland
# Icons: Hack Nerd Font (private-use glyphs) - Font Awesome + Material Design

bar:
  location: top
  height: 60
  layer: top
  font: FiraCode Nerd Font:pixelsize=20
  background: 1a1b26c8
  foreground: c9cbe0ff
  left-spacing: 6
  right-spacing: 6
  left-margin: 12
  right-margin: 12
  border:
    bottom-width: 5
    color: 7dcfff59

  left:
    # workspaces (script module, driven by hyprctl)
    - script:
        path: /home/otiko/.config/yambar/scripts/hypr-ws.sh
        content:
          list:
            spacing: 2
            items:
              - map:
                  conditions:
                    'ws1 != "" && focused == 1':
                      string:
                        text: "{ws1}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 1
                    'ws1 != ""':
                      string:
                        text: "{ws1}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "00000055"}}
                        on-click: hyprctl dispatch workspace 1
              - map:
                  conditions:
                    'ws2 != "" && focused == 2':
                      string:
                        text: "{ws2}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 2
                    'ws2 != ""':
                      string:
                        text: "{ws2}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "00000055"}}
                        on-click: hyprctl dispatch workspace 2
              - map:
                  conditions:
                    'ws3 != "" && focused == 3':
                      string:
                        text: "{ws3}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 3
                    'ws3 != ""':
                      string:
                        text: "{ws3}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "00000055"}}
                        on-click: hyprctl dispatch workspace 3
              - map:
                  conditions:
                    'ws4 != "" && focused == 4':
                      string:
                        text: "{ws4}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 4
                    'ws4 != ""':
                      string:
                        text: "{ws4}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "00000055"}}
                        on-click: hyprctl dispatch workspace 4
              - map:
                  conditions:
                    'ws5 != "" && focused == 5':
                      string:
                        text: "{ws5}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 5
                    'ws5 != ""':
                      string:
                        text: "{ws5}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "00000055"}}
                        on-click: hyprctl dispatch workspace 5
              - map:
                  conditions:
                    'ws6 != "" && focused == 6':
                      string:
                        text: "{ws6}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 6
