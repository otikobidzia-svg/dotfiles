font_family      fira code font
font_size        11
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0
background_opacity 0.45

# Ensure zsh regardless of inherited $SHELL
shell /bin/zsh

font_family FiraCode Nerd Font

# ---- Blue/Cyan theme ----
background            #0a0f1e
foreground            #c0caf5
cursor                #7dcfff
cursor_text_color     #0a0f1e
selection_background  #7aa2f7
selection_foreground  #0a0f1e

