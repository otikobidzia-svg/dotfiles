                      string:
                        text: "{ws6}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "00000055"}}
                        on-click: hyprctl dispatch workspace 6
              - map:
                  conditions:
                    'ws7 != "" && focused == 7':
                      string:
                        text: "{ws7}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 7
                    'ws7 != ""':
                      string:
                        text: "{ws7}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "00000055"}}
                        on-click: hyprctl dispatch workspace 7
              - map:
                  conditions:
                    'ws8 != "" && focused == 8':
                      string:
                        text: "{ws8}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 8
                    'ws8 != ""':
                      string:
                        text: "{ws8}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "00000055"}}
                        on-click: hyprctl dispatch workspace 8
              - map:
                  conditions:
                    'ws9 != "" && focused == 9':
                      string:
                        text: "{ws9}"
                        foreground: "12141fff"
                        left-margin: 4
                        right-margin: 4
                        deco: {background: {color: "7dcfffff"}}
                        on-click: hyprctl dispatch workspace 9
                    'ws9 != ""':
                      string:
                        text: "{ws9}"
                        foreground: "a9b1d6ff"
                        left-margin: 4
                        right-margin: 4
